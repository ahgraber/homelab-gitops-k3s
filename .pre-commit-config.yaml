---
# Run these hooks with `prek`: https://github.com/j178/prek
# prek reads this file; see https://pre-commit.com/hooks.html for more hooks

default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
  - pre-push
  - commit-msg

default_stages:
  - pre-commit

exclude: |
  (?x)^(
    ^.*(copier-answers\.ya?ml)$ |
    ^.*\.rej$
  )$

repos:
  - repo: local
    hooks:
      - id: forbid-yml
        name: Forbid .yml file extensions (use .yaml)
        entry: YAML file extensions must be .yaml
        language: fail
        files: \.yml$
        exclude: |
          (?x)^(
            ^.*(copier-answers\.ya?ml)$ |
            ^(great-docs\.yml)$
          )$
      - id: forbid-rej
        name: Forbid .rej file extensions from `copier update`
        entry: Forbid .rej file extensions from `copier update`
        language: fail
        files: \.rej$
      - id: forbid-co-authored-by-trailer
        name: Require AI-assistant attribution trailer
        language: system
        stages: [commit-msg]
        entry: >-
          bash -c '
            if rg -qi "^Co-authored-by:" "$1"; then
              printf "%s\\n" \
                "Commit messages must not include a Co-authored-by trailer." \
                "Use: 'AI-assistant:' trailer instead." >&2
              exit 1
            fi
          ' --
  # renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-ast
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=Lucas-C/pre-commit-hooks
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: "v1.5.6"
    hooks:
      - id: remove-crlf
        stages: [pre-commit]
      # - id: remove-tabs
      #   stages: [pre-commit]
  # renovate: datasource=github-tags depName=sirosen/texthooks
  - repo: https://github.com/sirosen/texthooks
    rev: "0.7.1"
    hooks:
      - id: fix-smartquotes
        stages: [pre-commit]
      - id: fix-ligatures
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=gitleaks/gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.1"
    hooks:
      - id: gitleaks
  # # renovate: datasource=github-tags depName=betterleaks/betterleaks
  # - repo: https://github.com/betterleaks/betterleaks
  #   rev: "v1.1.0"
  # renovate: datasource=github-tags depName=python-jsonschema/check-jsonschema
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.0"
    hooks:
      - id: check-github-workflows
      # check-github-workflows does not cover composite actions
      - id: check-github-actions
  # Lint: GitHub Actions security posture (unpinned actions, excessive
  # permissions, credential persistence, template injection, cache poisoning).
  # check-jsonschema above only validates shape, not security.
  # renovate: datasource=github-tags depName=zizmorcore/zizmor-pre-commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "v1.30.0"
    hooks:
      - id: zizmor
  # renovate: datasource=github-tags depName=stefmolin/exif-stripper
  - repo: https://github.com/stefmolin/exif-stripper
    rev: 1.2.0
    hooks:
      - id: strip-exif
        name: Strip exif metadata from images
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=commitizen-tools/commitizen
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        language: python
        stages:
          - commit-msg
  # renovate: datasource=github-tags depName=editorconfig-checker/editorconfig-checker.python
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.11.1"
    hooks:
      - id: editorconfig-checker
        name: Check editorconfig compliance
        exclude: |
          (?x)^(
            # these file types may have nonstandard indents
            ^(LICENSE)$ |
            ^.*(\.md)$ |
            ^.*(\.qmd)$ |
            ^.*(\.rst)$
          )$
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=hukkin/mdformat
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-front-matters
          - mdformat-footnote
          - mdformat-gfm-alerts
          # - mdformat-tables # now included in mdformat-gfm
          - mdformat-toc
          - mdformat-config
          # - mdformat-shfmt # disable until can pass args (ref: https://github.com/hukkin/mdformat-shfmt/issues/7)
          - mdformat-simple-breaks
  # renovate: datasource=github-tags depName=rvben/rumdl-pre-commit
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.64
    hooks:
      # - id: rumdl      # Lint only (fails on issues)
      #   stages: [pre-commit]
      - id: rumdl-fmt  # Auto-format (fixes what it can)
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.5"
    hooks:
      - id: ruff-check
        name: Lint with Ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        name: Format with Ruff
        types_or: [python, pyi, jupyter, markdown]  # also formats python blocks in md
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=kynan/nbstripout
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: Strip metadata and outputs from ipynb files
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=AleksaC/hadolint-py
  - repo: https://github.com/AleksaC/hadolint-py
    rev: "v2.15.1"
    hooks:
      - id: hadolint
        name: Lint Dockerfiles
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=shellcheck-py/shellcheck-py versioning=loose
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1"
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        exclude: "^.*zsh$" # ignore '*.zsh" scripts'
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=scop/pre-commit-shfmt versioning=loose
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: "v3.13.1-1"
    hooks:
      - id: shfmt
        name: Format shell scripts
        # shfmt-py's sdist build only supports CPython <= 3.13
        language_version: python3.13
        # `args` replaces the hook's default `[--write]` rather than appending to it, so `--write` must be
        # repeated here; without it shfmt prints to stdout, changes nothing, and always exits 0.
        args:
          - "--write"
          - "--binary-next-line"
          - "--case-indent"
          - "--space-redirects"
          - "--indent"
          - "2"
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=biomejs/pre-commit
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.11
    hooks:
      - id: biome-check
        stages: [pre-commit]
  # renovate: datasource=github-tags depName=adrienverge/yamllint
  - repo: https://github.com/adrienverge/yamllint
    rev: "v1.38.0"
    hooks:
      - id: yamllint
        name: Lint yaml files
        args: [-c=.yamllint.yaml]
        stages: [pre-commit]
  ### NOTE: ".typos.toml" may be required to have _already been committed_
  ### in order for typos pre-commit hook to read it.
  ### In this case, comment out this block until ".typos.toml" has been committed successfully
  # renovate: datasource=github-tags depName=crate-ci/typos
  - repo: https://github.com/crate-ci/typos
    rev: "v1.50.1"
    hooks:
      - id: typos
        name: Spellcheck with Typos
        # `args` replaces the hook's default `[--write-changes, --force-exclude]` rather than appending to it.
        # `--force-exclude` is repeated so `.typos.toml`'s exclusions still apply to explicitly-passed files.
        args: ["--force-exclude", "--config", ".typos.toml"]
        exclude: |
          (?x)^(
            ^.*(typos\.toml)$ |
            ^.*(\.typos\.toml)$ |
            ^.*(\.sops\.yaml)$ |
            ^.*(\.git.*)$
          )$
        stages: [pre-commit]
