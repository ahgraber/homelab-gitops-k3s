---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datasci-agentsview-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agentsview-oidc
    template:
      data:
        client-secret: '{{ index . "client-secret" }}'
  dataFrom:
    - extract:
        key: datasci.agentsview
