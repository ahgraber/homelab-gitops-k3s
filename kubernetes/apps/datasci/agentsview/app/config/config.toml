# AgentsView server config, copied into /data/config.toml at pod start.
#
# The file must stay writable: `pg serve` generates an auth token into it on
# startup and treats a write failure as fatal. It is seeded by an init
# container rather than mounted, because a mounted file is read-only.
#
# Connection settings are NOT set here. AGENTSVIEW_PG_URL comes from the
# database-agentsview secret and overrides anything this file says about [pg].

# Semantic search over vectors the workstations embed and push.
#
# The hub embeds nothing itself; it only encodes search queries, through the
# same OpenAI endpoint the workstations use. Model identity (model, dimension,
# max_input_chars, and any prefixes/suffixes) must match every workstation's
# config.toml byte for byte: those fields form the generation fingerprint, and
# a mismatch leaves the hub with no vectors it can compare against, so semantic
# search returns "not available" while text search keeps working. Transport
# settings (endpoint, api_key_env, timeouts) may differ.
#
# AGENTSVIEW_OPENAI_API_KEY comes from the agentsview-embeddings secret.
# Search also needs the `vector` extension (pgvector 0.7.0 or newer) in the
# agentsview database; see the README.
[vector]
enabled = true

[vector.embeddings]
model = "openai/text-embedding-3-small"
dimension = 1536

[vector.embeddings.servers.openrouter]
endpoint = "https://openrouter.ai/api/v1"
api_key_env = "AGENTSVIEW_OPENROUTER_API_KEY"
