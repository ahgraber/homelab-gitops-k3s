# AgentsView server config, copied into /data/config.toml at pod start.
#
# The file must stay writable: `pg serve` generates an auth token into it on
# startup and treats a write failure as fatal. It is seeded by an init
# container rather than mounted, because a mounted file is read-only.
#
# Connection settings are NOT set here. AGENTSVIEW_PG_URL comes from the
# database-agentsview secret and overrides anything this file says about [pg].

# Semantic search, off by default.
#
# Turning it on takes three things:
#
#   1. The `vector` extension in the agentsview database. The Postgres CR in
#      db/postgres.yaml requests it; confirm with
#      `\dx` in psql before trusting it.
#   2. The block below, filled in and enabled = true. Model identity
#      (model, dimension, and any prefixes/suffixes) must match the
#      workstations byte for byte: those fields form the generation
#      fingerprint, and a mismatch means the hub finds no vectors it can
#      compare against and serves no semantic results. Only the endpoint is
#      allowed to differ.
#   3. An OpenAI-compatible embeddings endpoint the pod can reach, used to
#      encode search queries. There is none in-cluster today.
#
# With enabled = false the rest is ignored. With enabled = true, model,
# dimension, and at least one server are required, and the pod refuses to
# start without them.
[vector]
enabled = false

# [vector.embeddings]
# model = "text-embedding-3-small"
# dimension = 1536
# default_server = "default"
#
# [vector.embeddings.servers.default]
# endpoint = "https://openrouter.ai/api/v1"
# api_key_env = "AGENTSVIEW_EMBEDDINGS_API_KEY"
