---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./source.yaml
  - ./helmrelease.yaml
  - ./secret-oidc.externalsecret.yaml
  - ./securitypolicy.yaml

configMapGenerator:
  - name: agentsview-config
    files:
      - ./config/config.toml
generatorOptions:
  disableNameSuffixHash: true
