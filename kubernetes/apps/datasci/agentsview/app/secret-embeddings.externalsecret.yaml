---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datasci-agentsview-embeddings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: agentsview-embeddings
    template:
      data:
        openai-api-key: '{{ index . "openai-api-key" }}'
  dataFrom:
    - extract:
        key: datasci.agentsview
