# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/mutatingpolicy_v1.json
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: label-httproutes
  annotations:
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: HTTPRoute,Label
    policies.kyverno.io/description: >-
      Automatically labels HTTPRoutes as 'internal' or 'external' based on
      their parent gateway reference. This helps with identifying and filtering
      routes based on their exposure level. An 'external' parent takes
      precedence over an 'internal' parent.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  variables:
    - name: externalRefs
      expression: object.spec.?parentRefs.orValue([]).filter(r, r.name.contains('external'))
    - name: internalRefs
      expression: object.spec.?parentRefs.orValue([]).filter(r, r.name.contains('internal'))
    - name: gatewayRef
      expression: >-
        size(variables.externalRefs) > 0 ? variables.externalRefs[0] : variables.internalRefs[0]
  matchConditions:
    - name: has-known-gateway
      expression: size(variables.externalRefs) > 0 || size(variables.internalRefs) > 0
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.metadata.?labels['route.gateway.io/exposure'].hasValue() ? Object{} :
          Object{
            metadata: Object.metadata{
              labels: {"route.gateway.io/exposure": size(variables.externalRefs) > 0 ? "external" : "internal"}
            }
          }
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          object.metadata.?labels['route.gateway.io/gateway'].hasValue() ? Object{} :
          Object{
            metadata: Object.metadata{
              labels: {"route.gateway.io/gateway": variables.gatewayRef.name}
            }
          }
