# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/mutatingpolicy_v1.json
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-limit
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods.
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: not-ignored
      expression: object.metadata.?annotations['kyverno.io/ignore'].orValue('') != 'true'
  variables:
    - name: initContainers
      expression: object.spec.?initContainers.orValue([])
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.containers
            .filter(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits)
            .map(c, JSONPatch{
              op: "remove",
              path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/resources/limits/cpu"
            })
          +
          variables.initContainers
            .filter(c, has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits)
            .map(c, JSONPatch{
              op: "remove",
              path: "/spec/initContainers/" + string(variables.initContainers.indexOf(c)) + "/resources/limits/cpu"
            })
