# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/mutatingpolicy_v1.json
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-safe-to-evict
  annotations:
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: Pod,Annotation
    policies.kyverno.io/description: >-
      The Kubernetes cluster autoscaler does not evict pods that
      use hostPath or emptyDir volumes. To allow eviction of these pods, the annotation
      cluster-autoscaler.kubernetes.io/safe-to-evict=true must be added to the pods.
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: not-ignored
      expression: object.metadata.?annotations['kyverno.io/ignore'].orValue('') != 'true'
    - name: has-local-volume
      expression: object.spec.?volumes.orValue([]).exists(v, has(v.emptyDir) || has(v.hostPath))
    - name: annotation-absent
      expression: >-
        !object.metadata.?annotations['cluster-autoscaler.kubernetes.io/safe-to-evict'].hasValue()
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {"cluster-autoscaler.kubernetes.io/safe-to-evict": "true"}
            }
          }
