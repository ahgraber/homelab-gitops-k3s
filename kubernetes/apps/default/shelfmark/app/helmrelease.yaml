---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/search: "true"
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark
              # tag: dev@sha256:0e8952e2e30cacbb2dfa7bb68a70be62f6d993eb5953af43ed891f2cdee3231b
              tag: v1.4.0
            env:
              TZ: "America/New_York"
              FLASK_PORT: &port 8084
              INGEST_DIR: &ingest /cwa-book-ingest
              SESSION_COOKIE_SECURE: "true"
              HIDE_LOCAL_AUTH: "false"
              OIDC_AUTO_REDIRECT: "false"
              BOOK_LANGUAGE: en
              DEFAULT_SLEEP: "15"
              LOG_LEVEL: info
              USE_CF_BYPASS: true
              CALIBRE_WEB_URL: https://calibre.${SECRET_DOMAIN}
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 24
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  timeoutSeconds: 5
                  periodSeconds: 15
                  failureThreshold: 8
              readiness: *probes
            # upstream: 2GB is a safe minimum when the bypasser runs Chromium
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - shelfmark.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: *port
            timeouts:
              request: 0s

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      ingest:
        existingClaim: calibre-library
        globalMounts:
          - path: *ingest
            subPath: ingest
            readOnly: false
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp/shelfmark
      # Kubernetes defaults /dev/shm to 64Mi, which Chromium can exhaust
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
