---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    fullnameOverride: k8s-gateway

    image:
      repository: codeberg.org/k8s-gateway/k8s_gateway
      tag: 1.9.2
      pullPolicy: IfNotPresent

    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: 10.2.118.2
      externalTrafficPolicy: Cluster # don't change!

    servers:
      - zones:
          - zone: ${SECRET_DOMAIN}
        port: 1053
        servicePort: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: k8s_gateway
            parameters: ${SECRET_DOMAIN}
            configBlock: |-
              ttl 1
              resources GRPCRoute HTTPRoute Ingress Service
              gatewayClasses envoy-internal
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: loop
          - name: reload
          - name: loadbalance
