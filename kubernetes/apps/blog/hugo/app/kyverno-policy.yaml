---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/policies.kyverno.io/namespacedgeneratingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: hugo-cache-purge-on-rollout
  annotations:
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: Deployment, Job
    policies.kyverno.io/description: >-
      Automatically purge Cloudflare cache when Hugo deployment is updated
      with a new image tag or configuration change.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  matchConditions:
    - name: is-hugo
      expression: object.metadata.name == 'hugo' || object.metadata.name.startsWith('hugo-')
    - name: generation-changed
      expression: object.metadata.generation != oldObject.metadata.generation
    - name: has-cache-tag
      expression: oldObject.metadata.?annotations['cache.cloudflare.com/tag'].orValue('') != ''
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: cache-purge-(( string(object.metadata.generation) ))
            namespace: blog
          spec:
            template:
              spec:
                containers:
                  - name: purge
                    image: curlimages/curl:latest
                    command: ["/bin/sh"]
                    args:
                      - "-c"
                      - |
                        curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
                          -H "Authorization: Bearer $CF_API_TOKEN" \
                          -H "Content-Type: application/json" \
                          --data "{\"tags\":[\"$CF_CACHE_TAG\"]}"
                    env:
                      - name: CF_CACHE_TAG
                        value: (( oldObject.metadata.annotations['cache.cloudflare.com/tag'] ))
                    envFrom:
                      - secretRef:
                          name: hugo
                restartPolicy: Never
            backoffLimit: 2
            ttlSecondsAfterFinished: 1800
