name: CI Docs

# Only the inputs the site is built from: the landing page (root README), the
# hand-authored guides, the per-app READMEs that gen_app_pages.py aggregates,
# the site config and generator, and the docs toolchain deps.
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - kubernetes/apps/**/README.md
      - great-docs.yml
      - scripts/docs/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yaml
  pull_request:
    paths:
      - README.md
      - docs/**
      - kubernetes/apps/**/README.md
      - great-docs.yml
      - scripts/docs/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # PRs supersede: a new push to the branch cancels the stale build.
  # main queues instead — cancelling a run mid-deploy is what leaves a Pages
  # deployment stuck. Batches still collapse to the last commit, because a newly
  # queued run replaces the previous pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for accurate page timestamps
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install package and dependencies
        run: |
          python -m pip install uv
          uv sync --group docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Generate app pages
        # Rebuilds docs/projects/ from per-app READMEs (gitignored output).
        # Runs the secret/leak gate — a hard finding fails the build.
        run: uv run scripts/docs/gen_app_pages.py

      - name: Build docs
        run: uv run --group docs great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    # Pages allows one deployment at a time, and interrupting one leaves it stuck
    # in-progress — queue instead of cancelling (ref: actions/starter-workflows
    # pages/static.yml). Without this, rapid merges to main fail with
    # "Deployment request failed ... due to in progress deployment".
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
