---
# use own bot instead of Mend/Renovate app
name: "Renovate"

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      packages: read # GHCR lookups for container datasources
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: "${{ vars.BOT_APP_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          # Renovate's platform requirements, minus the org-level scopes it only
          # needs for autodiscovery beyond this repo
          # (ref: https://docs.renovatebot.com/modules/platform/github/):
          #   contents             - commit branches
          #   issues               - dependency dashboard
          #   workflows            - update files under .github/workflows
          #   vulnerability-alerts - read Dependabot alerts to raise security PRs
          #   statuses             - the `renovate/stability-days` check that
          #                          `minimumReleaseAge` gates merges on
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-vulnerability-alerts: read
          permission-statuses: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Renovate clones the repo itself; no git credentials needed here
          token: "${{ steps.app-token.outputs.token }}"
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@973d3e5a68e735a444e8c03432b66eedb343c302 # v46.2.0
        env:
          LOG_LEVEL: "${{ inputs.logLevel || 'debug' }}"
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: "${{ github.repository }}"
          RENOVATE_DRY_RUN: "${{ inputs.dryRun }}"
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
        with:
          ## Intentionally rely on repository config discovery for .renovaterc.json5.
          ## Setting configurationFile here can cause the same config to be loaded twice.
          # configurationFile: .renovaterc.json5
          token: "${{ steps.app-token.outputs.token }}"
          renovate-version: "${{ inputs.version || 'latest' }}"
